name: Construire l'APK Ma Sorcière

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le dossier android de manière isolée
        run: |
          if [ ! -d "android" ]; then
            mkdir -p /tmp/flutter_temp
            flutter create --platforms=android --org com.herdy --project-name ma_sorciere /tmp/flutter_temp
            cp -r /tmp/flutter_temp/android ./android
            rm -rf /tmp/flutter_temp
          fi

      - name: Dépendances
        run: flutter pub get

      - name: Compiler l'APK
        run: flutter build apk --debug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ma-sorciere-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error