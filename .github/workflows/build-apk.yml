name: Construire l'APK Ma Sorcière

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le dossier android de manière isolée
        run: |
          scaffold="$(mktemp -d)"
          flutter create --org com.herdy --project-name ma_sorciere --platforms=android "$scaffold/scaffold"
          cp -R "$scaffold/scaffold/android" ./android

      - name: Dépendances
        run: flutter pub get

      - name: Compiler l'APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ma-sorciere-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error